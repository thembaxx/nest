name: One-time upgrade formatting repair
on:
  push:
    branches: [chore/deps-latest-stable-20261022]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply Oxfmt and verify formatting
        run: |
          pnpm exec oxfmt --write .
          pnpm format:check
      - name: Commit format-only fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-upgrade-repair.yml
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply updated Oxfmt formatting'
            git push
          fi
